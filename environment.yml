# install with: conda env create -f environment.yml
name: "job_opt"
channels:
  - conda-forge
  - anaconda
  - defaults
dependencies:
  - python==3.12
  - pip
  # Installed through conda rather than pip so that the cairo/pango system
  # libraries WeasyPrint links against come with it.
  - weasyprint
  # Everything else is declared once, in requirements-dev.txt.
  - pip:
      - -r requirements-dev.txt
